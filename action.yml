name: setup-node-action
description: >
  Shared environment setup for Diplodoc workflows: configures Node.js, bumps npm
  to the required version (fork-safe) and optionally installs dependencies.

inputs:
  node-version:
    description: 'Node.js version passed to actions/setup-node. Pass the NODE_VERSION org/repo variable from the calling workflow.'
    required: false
    default: ''
  npm-version:
    description: 'Minimum required npm version. npm is upgraded only if the runner ships an older one.'
    required: false
    default: '11.5.1'
  registry-url:
    description: 'Optional npm registry URL (needed for publish / dependency-update workflows).'
    required: false
    default: ''
  cache:
    description: 'Package manager cache for actions/setup-node ("npm" by default, set to "" to disable).'
    required: false
    default: 'npm'
  run-install:
    description: 'Run "npm ci" after setup. Set to "false" when install must be conditional or customized.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: ${{ inputs.cache }}

    - name: Install latest npm (>= required)
      shell: bash
      env:
        REQUIRED: ${{ inputs.npm-version }}
      run: |
        if [ "$(printf '%s\n' "$REQUIRED" "$(npm -v)" | sort -V | head -n1)" = "$REQUIRED" ]; then
          echo "npm $(npm -v) is up-to-date (>= $REQUIRED)"
          exit 0
        fi
        # Use a user-writable prefix so this works in PRs from forks where
        # the default global prefix may be read-only. Prepend its bin dir to
        # PATH via $GITHUB_PATH so subsequent steps pick up the new npm.
        NPM_PREFIX="$RUNNER_TEMP/npm-global"
        mkdir -p "$NPM_PREFIX"
        npm install --prefix "$NPM_PREFIX" -g "npm@$REQUIRED"
        # On Linux/macOS npm puts binaries into $prefix/bin, on Windows
        # directly into $prefix (as npm.cmd). Pick whichever exists.
        if [ -x "$NPM_PREFIX/bin/npm" ] || [ -x "$NPM_PREFIX/bin/npm.cmd" ]; then
          NPM_BIN_DIR="$NPM_PREFIX/bin"
        else
          NPM_BIN_DIR="$NPM_PREFIX"
        fi
        echo "$NPM_BIN_DIR" >> "$GITHUB_PATH"
        "$NPM_BIN_DIR"/npm -v 2>/dev/null || "$NPM_BIN_DIR"/npm.cmd -v

    - name: Install dependencies
      if: inputs.run-install == 'true'
      shell: bash
      run: npm ci
